schema_version = "1.0.0"

# BBone to Bones - convert bendy bones into real bone chains.
id = "bbone_to_bones"
version = "0.2.1"
name = "BBone to Bones"
tagline = "Converts bendy bones into real bone chains ready for export"
maintainer = "Piero Fra"

type = "add-on"

# Sito progetto e titolarità dei diritti (Blender Extensions).
website = "https://github.com/PieroFra/bbone-to-bones"
copyright = [
  "2026 PieroFra",
]

# Blender Extensions: GPL v3+ is a requirement for the official platform.
license = [
  "SPDX:GPL-3.0-or-later",
]

blender_version_min = "4.2.0"

tags = [
  "Rigging",
]

description = "Converts Bendy Bones into parented bone segments with automatic skin weight transfer, optional follow constraint and bake, export presets for FBX (Unity/Unreal) and glTF (Godot), plus a full revert to the original BBones."

# v1: BBone conversion >= weights >= bake >= export presets (FBX Unity/UE, glTF Godot).

# Esclusioni per "blender --command extension build": nel pacchetto va solo il
# runtime dell'addon, nessun file di sviluppo.
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/tests/",
  "/docs/",
  "/dist/",
  "/ci-logs/",
  "/*.blend",
  "/*.blend1",
]
